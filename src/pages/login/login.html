<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Login to our Films database</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{getAuthJSON()}}</p>
    <mat-form-field>
      <mat-label>User name</mat-label>
      <input matInput [value]="auth().name" (keyup)="updateName($event)">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput [type]="hide() ? 'password' : 'text'" />
      <button type="button" matIconButton matSuffix
        (click)="toggleShowPassword()"
        [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hide()">
        <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    <button matButton>Login</button>
  </mat-card-actions>
</mat-card>
