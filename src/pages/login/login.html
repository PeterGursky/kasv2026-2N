<form (ngSubmit)="onSubmit()">
  <mat-card class="example-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Login to our Films database</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{getAuthJSON()}}</p>
      <mat-form-field>
        <mat-label>User name</mat-label>
        <!-- <input matInput [value]="auth().name" (keyup)="updateName($event)"> -->
        <input matInput [(ngModel)]="auth().name" name="username">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput [type]="hide() ? 'password' : 'text'" 
          [(ngModel)]="auth().password" name="password">
        <button type="button" matIconButton matSuffix
          (click)="toggleShowPassword()"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide()">
          <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button type="submit" matButton>Login</button>
    </mat-card-actions>
  </mat-card>
</form>
