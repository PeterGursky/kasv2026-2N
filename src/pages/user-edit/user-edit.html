<p>username: {{user().name}}</p>
<form>
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Editing user with id {{userId()}}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field>
        <mat-label>User name</mat-label>
        <input matInput>
        <mat-hint>Username</mat-hint>
        <mat-error></mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>E-mail</mat-label>
        <input matInput>
        <mat-hint>Enter e-mail</mat-hint>
        <mat-error></mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password">
        <button type="button" matIconButton matSuffix
          (click)="toggleShowPassword()"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide()">
          <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-hint></mat-hint>
        <mat-error></mat-error>
      </mat-form-field>
      <mat-slide-toggle>Active user</mat-slide-toggle>
      <div>Groups, the user is member of:</div>
      @for(group of allGroups(); track group.id) {
        <mat-checkbox>{{group.name}}</mat-checkbox>
      }
    </mat-card-content>
    <mat-card-actions>
      <button type="submit" matButton>Save</button>
    </mat-card-actions>
  </mat-card>
</form>
<a routerLink="../{{userId() - 1}}" matButton>Previous</a>
<a routerLink="../{{userId() + 1}}" matButton>Next</a>
