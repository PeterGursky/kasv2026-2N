<ul>
  @for(user of users(); track user) {
    <li>{{user}}</li>
  }
</ul>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>E-mail</th>
    </tr>
  </thead>
  <tbody>
    @for (user of users(); track user.name) {
      <tr (click)="selectUser(user)">
        <td>{{user.id}}</td>
        <td>{{user.name}}</td>
        <td>{{user.email}}</td>
      </tr>
    }
  </tbody>
</table>
@let selected = selectedUser();
@if(selected){
  <p>
    Selected user: {{selected.name}}
  </p>
}
